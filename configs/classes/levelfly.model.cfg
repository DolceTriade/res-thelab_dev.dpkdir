name "Shrike"
model levelfly
modelScale 1.0
skin default
shadowScale 1.0
hud alien_general_hud

// Cubic wallwalk hull, centered on the physics origin: 44 units on every axis.
// The body/legs were resized and centered in Blender; wings/tail may extend out.
// Local mesh feet are at Z=0; the normal renderer applies its -22 Z offset.
mins              -22 -22 -22
maxs              22 22 22
crouchMaxs        22 22 22
deadMins          -22 -22 -22
deadMaxs          22 22 22
zOffset           0

viewheight        10
crouchViewheight  10
shoulderOffsets   0 12 5
